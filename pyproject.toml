[project]
name = "ai-battle"
version = "0.1.0"
description = "赛博夺权战：多 AI 操作系统夺权竞技平台"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyside6>=6.12.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# ------------------------------------------------------------------ ruff

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # 与 ruff format 冲突（官方建议使用 formatter 时关闭）
    "COM812",
    "ISC001",
    # 中文项目：全角标点会被判定为“易混淆字符”；中文句号不被 D400/D415 认可
    "RUF001",
    "RUF002",
    "RUF003",
    "D400",
    "D415",
    # 中文项目不需要英文版权头
    "CPY001",
    # 不强制 TODO 的作者/链接格式
    "TD002",
    "TD003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "main",
    "ops",
    "permissions",
    "state",
    "worldlog",
    "arena",
    "battlelink",
    "gateway",
    "kernel",
    "ledger",
    "matchconfig",
    "mockai",
    "orchestrator",
    "recovery",
    "referee",
    "scoring",
    "snapshot",
    "observatory",
    "mini_kernel",
    "dev_arena",
    "dev_kernel",
    "dev_match",
]

[tool.ruff.lint.per-file-ignores]
# stdout 是协议通道；内核信道容错吞异常
"src/server/main.py" = ["T201", "BLE001", "S112"]
# 基座是脚本式模块，整体拷进 battle/server 直接运行，不需要 __init__.py
"src/server/**" = ["INP001"]
# exec/shell 按设计敞开；分发器天然多分支多返回
"src/server/ops.py" = ["S102", "S404", "S602", "S603", "BLE001", "PLR0911", "PLR0912", "C901"]
# 内核也是脚本式模块：subprocess 拉起服务器 / git / docker 是本职工作
"src/controler/**" = ["INP001", "S404", "S603", "S607", "PLR0913"]
# 内核 CLI 要打摘要
"src/controler/kernel.py" = ["T201"]
# 开发工具：打印、断言、布尔参数、长场景函数和宽签名都是刻意的
"scripts/**" = [
    "T201",
    "S101",
    "S404",
    "S603",
    "FBT001",
    "INP001",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "ANN401",
    "C901",
    "RUF059",
]
# skill 附带的复盘脚本：命令行工具，打印与宽函数都正常
"docs/**" = [
    "T201",
    "INP001",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "D103",
    "ANN401",
    "PLW2901",
]
# dev_match 先做 sys.path 接线再导入内核模块
"scripts/dev_match.py" = ["E402"]
# dev_arena 同上，且要手动建容器/回合，宽一点
"scripts/dev_arena.py" = ["E402"]
# 测试：断言、魔法数字
"tests/**" = ["S101", "INP001", "PLR2004"]
# 观测台：Qt 信号槽天然是位置布尔参数
"observatory/app.py" = ["FBT001"]

# ------------------------------------------------------------------ mypy

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/server", "src/controler", "scripts", "tests", "observatory"]
mypy_path = [".", "src/server", "src/controler", "scripts"]

# ------------------------------------------------------------------ pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src/server", "src/controler", "scripts"]
